stages: [quality, test]

default:
  image: php:8.3-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libpq-dev libzip-dev libpng-dev libjpeg-dev >/dev/null
    - docker-php-ext-install pdo_pgsql zip gd bcmath >/dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist

lint:
  stage: quality
  script:
    - vendor/bin/pint --test
    - vendor/bin/phpstan analyse --no-progress --memory-limit=1G

tests:
  stage: test
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: jobportal_v2_test
    APP_ENV: testing
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: jobportal_v2_test
    DB_USERNAME: postgres
    DB_PASSWORD: ci
  script:
    - php artisan test:database:migrate --env=testing
    - php artisan test
