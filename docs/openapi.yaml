openapi: 3.0.3
info:
  title: Job Portal (Karir PKP) API
  version: 1.0.0
  description: |
    REST API Job Portal untuk aplikasi mobile / frontend terpisah.

    **Autentikasi** — Laravel Sanctum (Bearer token). Dapatkan token dari `POST /login`
    (atau `POST /social-media-authentication`), lalu kirim header `Authorization: Bearer <token>`.

    **Format respons** — sebagian besar endpoint mengembalikan `{ "data": ... }`.
    Endpoint yang memakai `ApiResponseHelpers` mengembalikan error sebagai `{ "error": "..." }`;
    validasi gagal mengembalikan HTTP 422 `{ "message": "...", "errors": { field: [..] } }`.

    **Catatan** — dokumen ini disusun dari pembacaan kode (`routes/api.php` dan controller).
    Struktur objek di dalam `data` (job, kandidat, perusahaan) berasal dari Resource/Service
    dan hanya digambarkan secara garis besar.
servers:
  - url: /api
    description: Server saat ini (relatif terhadap host)
tags:
  - name: Auth
    description: Login, registrasi, reset password
  - name: Website
    description: Konten publik (home, job, kandidat, perusahaan, blog, halaman statis)
  - name: Attributes
    description: Data master / referensi
  - name: Notifications
    description: Notifikasi dan device token FCM
  - name: Candidate
    description: Endpoint untuk user dengan role candidate
  - name: Company
    description: Endpoint untuk user dengan role company
security: []
paths:
  # ---------------------------------------------------------------- Auth
  /login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /register:
    post:
      tags: [Auth]
      summary: Registrasi akun candidate atau company
      description: "`role` selain `candidate` akan dianggap `company`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                role: { type: string, enum: [candidate, company], default: company }
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  message: { type: string, example: Registration Succeeded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /social-media-authentication:
    post:
      tags: [Auth]
      summary: Login / registrasi via Google atau Facebook (Firebase)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firebaseToken, provider, actionKey]
              properties:
                firebaseToken: { type: string, description: Access token dari provider }
                provider: { type: string, enum: [google, facebook] }
                actionKey: { type: string, enum: [login, registration] }
                role: { type: string, enum: [candidate, company], description: Wajib saat actionKey=registration }
      responses:
        '200':
          description: Berhasil (atau pesan `User does not exist` / `Role is missing` di dalam `data.message`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /profile:
    get:
      tags: [Auth]
      summary: Data user yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /user-info:
    get:
      tags: [Auth]
      summary: Validasi token dan ambil info user
      description: Token opsional di header; tanpa token mengembalikan 401.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /password/email:
    post:
      tags: [Auth]
      summary: Kirim kode reset password ke email
      description: |
        `data.code` hanya ikut dikembalikan saat `APP_ENV` = `local` atau `testing`.
        Di environment lain kode hanya dikirim lewat email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, description: Harus terdaftar }
      responses:
        '200':
          description: Kode dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      code: { type: integer, example: 123456 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /password/reset:
    post:
      tags: [Auth]
      summary: Reset password dengan kode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, email, password]
              properties:
                code: { type: string }
                email: { type: string, format: email, maxLength: 100 }
                password: { type: string, format: password, minLength: 8, maxLength: 50 }
      responses:
        '200':
          description: Password diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Kode salah atau kedaluwarsa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Website
  /home:
    get:
      tags: [Website]
      summary: Data halaman beranda
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /about:
    get:
      tags: [Website]
      summary: Testimoni dan statistik (live jobs, companies, candidates)
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /jobs:
    get:
      tags: [Website]
      summary: Daftar lowongan (dengan filter)
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: Cari berdasarkan judul }
        - { name: category, in: query, schema: { type: integer }, description: ID kategori }
        - { name: job_role, in: query, schema: { type: integer }, description: ID role }
        - { name: job_type, in: query, schema: { type: string }, description: Nama tipe pekerjaan }
        - { name: experience, in: query, schema: { type: string }, description: Nama level pengalaman }
        - { name: education, in: query, schema: { type: string }, description: Nama level pendidikan }
        - { name: company, in: query, schema: { type: string }, description: Filter perusahaan }
        - { name: tag, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number }, description: Dipakai bersama `long` }
        - { name: long, in: query, schema: { type: number } }
        - { name: price_min, in: query, schema: { type: number } }
        - { name: price_max, in: query, schema: { type: number } }
        - { name: is_remote, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: sort_by, in: query, schema: { type: string } }
        - { name: selected_country, in: header, schema: { type: string }, description: ID negara terpilih }
        - { $ref: '#/components/parameters/Paginate' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /jobs/{slug}:
    get:
      tags: [Website]
      summary: Detail lowongan
      description: Lowongan berstatus `pending` hanya dapat dilihat oleh pemilik (company) atau admin.
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidates:
    get:
      tags: [Website]
      summary: Daftar kandidat
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: profession, in: query, schema: { type: integer }, description: ID profesi }
        - { name: experience, in: query, schema: { type: string }, description: Nama atau `all` }
        - { name: education, in: query, schema: { type: string }, description: Nama atau `all` }
        - { name: gender, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: integer } }
        - { name: skills, in: query, schema: { type: array, items: { type: string } } }
        - { name: location, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: long, in: query, schema: { type: number } }
        - { name: sortby, in: query, schema: { type: string, example: latest } }
        - { $ref: '#/components/parameters/Paginate' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /candidates/{username}:
    get:
      tags: [Website]
      summary: Profil publik kandidat
      parameters:
        - { $ref: '#/components/parameters/Username' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /companies:
    get:
      tags: [Website]
      summary: Daftar perusahaan
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: industry_type, in: query, schema: { type: string } }
        - { name: organization_type, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: long, in: query, schema: { type: number } }
        - { name: sortBy, in: query, schema: { type: string, example: latest } }
        - { $ref: '#/components/parameters/Paginate' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /companies/{username}:
    get:
      tags: [Website]
      summary: Detail perusahaan
      parameters:
        - { $ref: '#/components/parameters/Username' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts:
    get:
      tags: [Website]
      summary: Daftar artikel blog (8 per halaman)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: ID kategori dipisah koma, example: '1,2' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /post/{slug}:
    get:
      tags: [Website]
      summary: Detail artikel
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /comment/{slug}/store:
    post:
      tags: [Website]
      summary: Kirim komentar pada artikel
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 2500 }
                parent_id: { type: integer, description: ID komentar induk (balasan) }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /pricing:
    get:
      tags: [Website]
      summary: Daftar paket (plan) aktif
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /faq:
    get:
      tags: [Website]
      summary: FAQ per kategori (sesuai bahasa aktif)
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
  /terms-condition:
    get:
      tags: [Website]
      summary: Syarat dan ketentuan
      responses:
        '200': { $ref: '#/components/responses/CmsPage' }
  /privacy-policy:
    get:
      tags: [Website]
      summary: Kebijakan privasi
      responses:
        '200': { $ref: '#/components/responses/CmsPage' }
  /refund-policy:
    get:
      tags: [Website]
      summary: Kebijakan pengembalian dana
      responses:
        '200': { $ref: '#/components/responses/CmsPage' }
  /contact:
    post:
      tags: [Website]
      summary: Kirim pesan kontak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name: { type: string, minLength: 3 }
                email: { type: string, format: email }
                subject: { type: string, minLength: 5 }
                message: { type: string, minLength: 10 }
                g-recaptcha-response: { type: string, description: Wajib jika captcha aktif }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /page-list:
    get:
      tags: [Website]
      summary: URL halaman website (blog, about, contact, faq, kebijakan)
      responses:
        '200': { $ref: '#/components/responses/DataObject' }

  # ---------------------------------------------------------------- Attributes
  /languages:
    get:
      tags: [Attributes]
      summary: Daftar bahasa
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /change-language/{code}:
    get:
      tags: [Attributes]
      summary: Ganti bahasa (disimpan di session)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: en } }
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /language/translations:
    get:
      tags: [Attributes]
      summary: Terjemahan bahasa aktif
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /localizations/{locale}/strings:
    get:
      tags: [Attributes]
      summary: String lokalisasi dari `resources/lang/{locale}.json`
      description: Mengembalikan objek kosong jika file tidak ada.
      parameters:
        - { name: locale, in: path, required: true, schema: { type: string, example: en } }
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /countries:
    get:
      tags: [Attributes]
      summary: Daftar negara
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        sortname: { type: string }
                        status: { type: integer }
  /change-country/{countryId}:
    get:
      tags: [Attributes]
      summary: Ganti negara terpilih (session)
      parameters:
        - { name: countryId, in: path, required: true, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /currencies:
    get:
      tags: [Attributes]
      summary: Daftar mata uang
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        code: { type: string, example: IDR }
                        symbol: { type: string }
  /change-currency/{code}:
    get:
      tags: [Attributes]
      summary: Ganti mata uang (session)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: IDR } }
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /categories:
    get:
      tags: [Attributes]
      summary: Kategori pekerjaan
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /job-roles:
    get:
      tags: [Attributes]
      summary: Role pekerjaan
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /experiences:
    get:
      tags: [Attributes]
      summary: Level pengalaman
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /educations:
    get:
      tags: [Attributes]
      summary: Level pendidikan
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /job-types:
    get:
      tags: [Attributes]
      summary: Tipe pekerjaan
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /popular-tags:
    get:
      tags: [Attributes]
      summary: Tag populer
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /professions:
    get:
      tags: [Attributes]
      summary: Daftar profesi
      responses: { '200': { $ref: '#/components/responses/DataObject' } }
  /current-session:
    get:
      tags: [Attributes]
      summary: Bahasa, negara, dan mata uang pada session saat ini
      responses: { '200': { $ref: '#/components/responses/DataObject' } }

  # ---------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: Notifikasi user login (10 per halaman)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /store-token:
    post:
      tags: [Notifications]
      summary: Simpan device token FCM untuk user login
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/DeviceToken' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /store-token-anonymous-user:
    post:
      tags: [Notifications]
      summary: Simpan device token FCM tanpa login
      requestBody: { $ref: '#/components/requestBodies/DeviceToken' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /send-notification:
    post:
      tags: [Notifications]
      summary: Kirim push notification ke device milik user login
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PushMessage' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /send-notification-all-users:
    post:
      tags: [Notifications]
      summary: Kirim push notification ke semua device
      description: |
        Hanya untuk admin (guard `admin`). User dengan token Sanctum biasa (candidate/company)
        mendapat 403.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PushMessage' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Bukan admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Candidate
  /candidate/jobs:
    get:
      tags: [Candidate]
      summary: Daftar lowongan untuk kandidat login
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /candidate/jobs/{slug}:
    get:
      tags: [Candidate]
      summary: Detail lowongan untuk kandidat login
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Slug' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /candidate:
    get:
      tags: [Candidate]
      summary: Profil kandidat (dibuat otomatis bila belum ada)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /candidate/dashboard:
    get:
      tags: [Candidate]
      summary: Ringkasan dashboard kandidat
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      profileComplated: { type: integer, description: Persentase kelengkapan profil }
                      appliedJobs: { type: integer }
                      favoriteJobs: { type: integer }
                      notifications: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /candidate/settings:
    get:
      tags: [Candidate]
      summary: Ambil data pengaturan kandidat
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [personal, profile, social, contact] }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Candidate]
      summary: Ubah pengaturan kandidat
      description: |
        Field yang dibutuhkan bergantung pada `type`:

        | type | field wajib |
        |---|---|
        | `personal` | name, title, experience_id, education_id, date_of_birth (opsional: website, image) |
        | `profile` | gender, marital_status, profession, status, bio (`available_in` bila status=`available_in`; opsional: skills, languages) |
        | `social` | social_media[], url[] |
        | `contact` | phone, email (opsional: secondary_phone, secondary_email, whatsapp_number, country, address, exact_location, lat, long) |
        | `password` | current_password, password, password_confirmation |
        | `account-delete` | current_password |
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [personal, profile, social, contact, password, account-delete] }
                name: { type: string, maxLength: 100 }
                title: { type: string, maxLength: 100 }
                experience_id: { type: integer }
                education_id: { type: integer }
                date_of_birth: { type: string, format: date }
                website: { type: string }
                image: { type: string, format: binary }
                gender: { type: string }
                marital_status: { type: string }
                profession: { type: string }
                status: { type: string }
                available_in: { type: string, format: date }
                bio: { type: string }
                skills: { type: array, items: { type: string } }
                languages: { type: array, items: { type: integer } }
                social_media: { type: array, items: { type: string } }
                url: { type: array, items: { type: string, format: uri } }
                phone: { type: string }
                secondary_phone: { type: string }
                email: { type: string, format: email }
                secondary_email: { type: string, format: email }
