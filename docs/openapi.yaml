                organization_type_id: { type: integer }
                industry_type_id: { type: integer }
                team_size_id: { type: integer }
                establishment_date: { type: string, format: date }
                website: { type: string }
                vision: { type: string }
                social_media: { type: array, items: { type: string } }
                url: { type: array, items: { type: string } }
                phone: { type: string, minLength: 4, maxLength: 16 }
                email: { type: string, format: email }
      responses:
