                          properties:
                            id: { type: integer }
                            social_media: { type: string }
                            url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum dari `POST /login`. Endpoint `/company/*` hanya untuk role `company`.
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Paginate:
      name: paginate
      in: query
      schema: { type: integer, default: 12 }
      description: Jumlah item per halaman
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
  requestBodies:
    DeviceToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, description: FCM device token }
    PushMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, body]
            properties:
              title: { type: string }
              body: { type: string }
    NameBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 2 }
  responses:
    DataObject:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                description: Payload; strukturnya bergantung pada endpoint
                oneOf:
                  - type: object
                  - type: array
                    items: {}
    CmsPage:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  content: { type: string, nullable: true, description: HTML sesuai bahasa aktif }
                  default_content: { type: string, nullable: true }
    Unauthenticated:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Unauthenticated }
        message: { type: string }
    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message: { type: string }
            status: { type: boolean }
    User:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [candidate, company] }
        name: { type: string }
        username: { type: string }
        email: { type: string, format: email }
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string, description: Bearer token Sanctum }
            message: { type: string }
            user:
              type: object
              description: CandidateResource atau CompanyResource sesuai role
    Resume:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        file: { type: string }
        file_size: { type: string }
    JobSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        country: { type: string }
        min_salary: { type: number }
        max_salary: { type: number }
        deadline: { type: string, format: date }
        status: { type: string }
        applied_jobs_count: { type: integer }
    JobInput:
      type: object
      required: [title, vacancies, salary_mode, salary_type, deadline, description, apply_on, hard_skill, soft_skill, benefits, show_salary, min_salary, max_salary]
      properties:
        title: { type: string, maxLength: 255 }
        category_id: { type: integer }
        role_id: { type: integer }
        experience: { type: string }
        education: { type: string }
        job_type: { type: integer }
        vacancies: { type: string }
        salary_mode: { type: string, enum: [range, custom] }
        custom_salary: { type: string, description: Wajib jika salary_mode=custom }
        min_salary: { type: number }
        max_salary: { type: number, description: Tidak boleh lebih kecil dari min_salary }
        salary_type: { type: integer }
        show_salary: { type: string }
        deadline: { type: string, format: date }
        description: { type: string }
        apply_on: { type: string, enum: [app, email, custom_url] }
        apply_email: { type: string, format: email, description: Wajib jika apply_on=email }
        apply_url: { type: string, format: uri, description: Wajib jika apply_on=custom_url }
        hard_skill: { type: string }
        soft_skill: { type: string }
        benefits: { type: string }
        notes: { type: string }
        badge: { type: string, enum: [featured, highlight] }
        is_remote: { type: integer, enum: [0, 1] }
        work_time: { type: integer }
        province_id: { type: string }
        city_id: { type: string, description: Kode BPS }
        subdistrict_id: { type: string, description: Kode BPS }
        grp_pos_id: { type: integer }
        job_order_id: { type: integer }
        tags: { type: array, items: { type: string } }
