    get:
      tags: [Company]
      summary: Data progres pengisian profil perusahaan
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Company]
      summary: Simpan satu langkah pengisian profil perusahaan
      description: |
        Field bergantung pada `step`:

        | step | field wajib |
        |---|---|
        | `1` | bio, logo (`image`) dan `banner` bila belum ada |
        | `2` | organization_type_id, industry_type_id, vision (opsional: establishment_date, team_size_id, website) |
        | `3` | social_media (opsional) |
        | `4` | phone, email |
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [step]
              properties:
