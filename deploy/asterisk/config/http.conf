; One HTTP server on the loopback address: ARI for the application (`/ari`) and the WebSocket the browsers register on (`/ws`). nginx exposes `/ws` only
; (nginx/api-karir.satu.solutions.asterisk.snippet), so ARI is reachable from this machine only. TLS ends at nginx.
[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
enablestatic = no
servername = jobportal-voice
