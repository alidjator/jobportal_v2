; The SIP trunk to the provider and the transports. The accounts of the team's browsers are not here: the application writes them through ARI (sorcery.conf).
[global]
type = global
user_agent = jobportal-voice
; Anything that is not a known account or the trunk's address is refused; nothing here accepts anonymous calls.
endpoint_identifier_order = ip,username

; ----- transports -----

; The trunk. Open UDP 5060 to the provider's signalling addresses only.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${ASTERISK_PUBLIC_IP}
external_signaling_address = ${ASTERISK_PUBLIC_IP}

; The browsers. The WebSocket is served by the HTTP server (http.conf) behind nginx, so TLS is not configured here.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

; ----- trunk -----

[trunk]
type = aor
contact = sip:${TRUNK_HOST}:${TRUNK_PORT}
qualify_frequency = 60

[trunk]
type = endpoint
transport = transport-udp
; Calls from the provider reach the message-only context; the number only places calls (design: calls back hear a recording).
context = jobportal-inbound
disallow = all
allow = ulaw,alaw
aors = trunk
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
; Present the platform number the application asks for (ARI `callerId`); some providers want it in a P-Asserted-Identity header (`send_pai = yes`).
trust_id_outbound = yes
#include "pjsip.trunk-endpoint.conf"

; The provider's signalling addresses; only they may use the trunk endpoint.
[trunk]
type = identify
endpoint = trunk
match = ${TRUNK_MATCH}

#include "pjsip.trunk-auth.conf"
