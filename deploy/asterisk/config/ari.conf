; The account of the application (`ASTERISK_ARI_USER` and `ASTERISK_ARI_PASSWORD` in its .env, same values as in asterisk.env).
[general]
enabled = yes
pretty = no
; Browsers never call ARI, so no cross-origin access is allowed.
allowed_origins =

[${ARI_USER}]
type = user
read_only = no
password_format = plain
password = ${ARI_PASSWORD}
