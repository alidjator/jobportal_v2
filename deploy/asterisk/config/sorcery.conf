; The accounts of the team's browsers are created and removed by the application through the ARI dynamic configuration
; (`/asterisk/config/dynamic/res_pjsip/{auth|aor|endpoint}/{id}`), which needs a writable store: the Asterisk internal database. The trunk stays in
; pjsip.conf; for every object the file is read first, so a browser account can never shadow the trunk.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = astdb,ps_endpoints
aor = config,pjsip.conf,criteria=type=aor
aor = astdb,ps_aors
auth = config,pjsip.conf,criteria=type=auth
auth = astdb,ps_auths
