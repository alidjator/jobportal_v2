noload = res_pjsip_mwi.so
noload = res_pjsip_outbound_publish.so
noload = res_ael_share.so
noload = pbx_ael.so
noload = pbx_lua.so
noload = pbx_dundi.so
noload = app_voicemail.so
noload = res_adsi.so
noload = cdr_custom.so
noload = cdr_manager.so
noload = cel_custom.so
noload = cel_manager.so
