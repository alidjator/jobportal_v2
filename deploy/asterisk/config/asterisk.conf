; Everything Asterisk writes goes to a tmpfs or to the recordings directory (the container is read-only). The ARI accounts of the team are kept in the
; internal database under astdbdir, so they are gone after a restart: the team joins again and the application provisions fresh ones.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /run/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; No console, no CLI socket users: logs go to the container output.
documentation_language = en_US
