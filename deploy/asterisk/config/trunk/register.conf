; Used when the provider wants the platform to register (TRUNK_AUTH=register); rendered into pjsip.trunk-auth.conf.
[trunk]
type = auth
auth_type = userpass
username = ${TRUNK_USERNAME}
password = ${TRUNK_PASSWORD}

[trunk]
type = registration
outbound_auth = trunk
server_uri = sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri = sip:${TRUNK_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
retry_interval = 60
expiration = 3600
