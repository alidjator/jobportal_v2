; Two contexts and nothing else. Nobody can dial out from the dialplan: outbound calls are only ever placed by the application through ARI.
[general]
static = yes
writeprotect = yes

; The team's browsers dial `interview-<id>`, the bridge of their interview, and are handed to the application (app `jobportal`), which checks that the account
; was issued for that interview before it lets the channel in.
[jobportal-team]
exten => _interview-.,1,NoOp(Team member joins ${EXTEN})
 same => n,Stasis(jobportal,team,${EXTEN})
 same => n,Hangup()

; A candidate who calls the platform number back hears why nobody answers, then the call ends. Nothing is routed to the team.
[jobportal-inbound]
exten => _[+0-9].,1,Answer()
 same => n,Wait(1)
 same => n,Playback(jobportal/call-back-info)
 same => n,Wait(1)
 same => n,Hangup()
exten => i,1,Hangup()
