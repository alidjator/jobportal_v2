; Media for the trunk and for the browsers (WebRTC). Open UDP 10000-10200 in the firewall; ICE learns the public address from STUN.
[general]
rtpstart = 10000
rtpend = 10200
icesupport = yes
stunaddr = ${STUN_SERVER}:${STUN_PORT}
strictrtp = yes
; The browsers' DTLS certificate is generated per endpoint (dtls_auto_generate_cert), so none is configured here.
