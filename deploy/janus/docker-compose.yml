# Run from this directory: `docker compose up -d --build` (`setup.sh` creates janus.env and the `.env` symlink Compose reads; janus.env holds secrets, never commit it).
# Needs a user in the docker group; the application user has no access to the Docker socket, so a sysadmin runs it.
#
# Host networking: WebRTC media needs a wide UDP range and the real public address, and the container then reaches the application's nginx on 127.0.0.1.
# The HTTP, Admin and converter listeners bind to 127.0.0.1 in the configuration, so only the WebSocket (behind nginx) and the media ports are reachable.
services:
  janus:
    build: .
    image: jobportal-janus:1
    restart: unless-stopped
    network_mode: host
    # Run as the application's user so the files on the shared volume can be deleted by the queue worker (`id -u jobportal`).
    user: "${APP_UID}:${APP_GID}"
    environment:
      JANUS_PUBLIC_IP: ${JANUS_PUBLIC_IP}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      JANUS_API_TOKEN: ${JANUS_API_TOKEN}
      JANUS_WEBHOOK_SECRET: ${JANUS_WEBHOOK_SECRET}
      APP_WEBHOOK_BASE: ${APP_WEBHOOK_BASE}
      STUN_SERVER: ${STUN_SERVER}
      STUN_PORT: ${STUN_PORT}
    volumes:
      - ${RECORDINGS_HOST_DIR}:/recordings
    # The server had about 1 GB of free memory when this was written: raise the limit only after checking `free -m`.
    mem_limit: 900m
    memswap_limit: 900m
    cpus: 3
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run/janus:size=8m,uid=${APP_UID},gid=${APP_GID}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18088/janus/info"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # TURN relay for browsers behind strict NATs, with time-limited credentials derived from TURN_SECRET (`use-auth-secret`, no user database).
  # The `turnserver` package on the host must stay disabled (`systemctl disable --now coturn`): it would take the same port.
  # UDP and TCP on 3478 only; TLS (`turns:`) is left out because the certificate private key is root-only. Add it later if clients behind UDP-blocking networks need it.
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --no-multicast-peers
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --listening-port=3478
      - --external-ip=${JANUS_PUBLIC_IP}
      - --min-port=50000
      - --max-port=50500
      - --total-quota=100
      - --user-quota=12
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --log-file=stdout
      - --simple-log
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The turnserver binary carries a file capability (low ports), so it must stay in the bounding set or exec fails with "Operation not permitted".
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
