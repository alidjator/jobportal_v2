# Add to /etc/nginx/conf.d/ (root-owned, not in git; keep this copy in step). The Janus container runs on the host network, so it reaches this
# server block on the loopback address; nothing outside the machine can. It serves only the two internal webhooks, no other path of the API.
server {
    listen 127.0.0.1:18089;
    server_name _;

    root /usr/local/src/jobportal/public;
    access_log /var/log/nginx/janus-internal-access.log;
    error_log  /var/log/nginx/janus-internal-error.log;

    client_max_body_size 256k;

    location ^~ /api/v1/internal/janus/ {
        include        fastcgi_params;
        fastcgi_pass   php83-fpm;
        fastcgi_param  SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_param  REQUEST_URI     $request_uri;
        fastcgi_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
