; The listener of the voice server's events (tele-interview form 3): it keeps one WebSocket open to Asterisk (ARI) and turns channel events into call status,
; attendance, missed-call notices and the end of recordings. Without it no call is logged and no browser reaches the bridge. Copy to
; /etc/supervisord.d/service-available/ and link it from service-enabled (see docs/deployment-checklist.md), then `supervisorctl reread && supervisorctl update`.
; Exactly one process: two listeners would handle every event twice. It reconnects by itself (every 3 s) while Asterisk is down; after a deploy
; `supervisorctl restart jobportal-voice-listener` loads the new code.

[program:jobportal-voice-listener]
command=/usr/bin/php artisan interview:voice-listen
process_name=%(program_name)s
numprocs=1
priority=12
autostart=true
autorestart=true
user=jobportal
directory=/usr/local/src/jobportal
stdout_logfile=/var/log/jobportal-voice-listener.log
stderr_logfile=/var/log/jobportal-voice-listener-error.log
killasgroup=true
stopasgroup=true
stopwaitsecs=10
startretries=20
