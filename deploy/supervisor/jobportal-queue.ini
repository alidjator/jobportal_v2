; Queue workers of the job portal API. Copy to /etc/supervisord.d/service-available/ and link it from service-enabled (see docs/deployment-checklist.md),
; then `supervisorctl reread && supervisorctl update`. Needs QUEUE_CONNECTION=database in the live .env (not `sync`) and the PHP pcntl extension.
;
; Two workers because `retry_after` belongs to a connection: `critical` and `default` use the default connection (retry after 90 s), `bulk` has its own
; connection (retry after 600 s, config/queue.php). A job's own `$timeout` stays below that: 60 s for the erasure listeners, 540 s on `bulk`.
; After a deploy run `php artisan queue:restart` so the workers pick up the new code.

[program:jobportal-queue]
command=/usr/bin/php artisan queue:work --queue=critical,default --tries=3 --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
priority=10
autostart=true
autorestart=true
user=jobportal
directory=/usr/local/src/jobportal
stdout_logfile=/var/log/jobportal-queue.log
stderr_logfile=/var/log/jobportal-queue-error.log
killasgroup=true
stopasgroup=true
stopwaitsecs=70
startretries=10

[program:jobportal-queue-bulk]
command=/usr/bin/php artisan queue:work bulk --queue=bulk --tries=3 --sleep=3 --timeout=540 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
priority=11
autostart=true
autorestart=true
user=jobportal
directory=/usr/local/src/jobportal
stdout_logfile=/var/log/jobportal-queue-bulk.log
stderr_logfile=/var/log/jobportal-queue-bulk-error.log
killasgroup=true
stopasgroup=true
stopwaitsecs=560
startretries=10
